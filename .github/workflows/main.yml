name: Build Beyond The End

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source ZIP
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract project
        run: |
          unzip -o Beyond-The-End-Source-1.1.0.zip -d source

      - name: Build plugin
        run: |
          mvn -f source/beyond-the-end/pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Beyond-The-End-JAR
          path: source/beyond-the-end/target/*.jar
